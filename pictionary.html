<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Class: Timed History Reveal</title>
    <style>
        :root {
            --brand-green: #008000;
            --brand-black: #000000;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: white;
            color: var(--brand-black);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h1 { color: var(--brand-green); border-bottom: 3px solid var(--brand-black); margin-bottom: 10px; }

        #score-board {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        #game-wrapper {
            position: relative;
            width: 600px;
            height: 400px;
            border: 4px solid var(--brand-black);
            background-color: #eee;
        }

        #target-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        #grid-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(6, 1fr);
        }

        .tile {
            background-color: var(--brand-green);
            border: 0.5px solid rgba(255,255,255,0.3);
            transition: opacity 0.8s;
        }

        .revealed { opacity: 0; }

        .ui-panel {
            margin-top: 20px;
            text-align: center;
            width: 600px;
        }

        input[type="text"] {
            padding: 12px;
            width: 70%;
            border: 3px solid var(--brand-black);
            font-size: 1.2rem;
            outline-color: var(--brand-green);
        }

        #feedback { 
            margin-top: 10px; 
            font-weight: bold; 
            height: 25px; 
            font-size: 1.1rem;
        }

        .answer-reveal {
            color: var(--brand-green);
            font-style: italic;
        }
    </style>
</head>
<body>

    <h1>History Reveal Challenge</h1>
    <div id="score-board">Points: 48</div>
    
    <div id="game-wrapper">
        <img id="target-image" src="" alt="Game Image">
        <div id="grid-overlay"></div>
    </div>

    <div class="ui-panel">
        <div id="feedback"></div>
        <input type="text" id="guessInput" placeholder="Who or what is this?" autocomplete="off">
    </div>

    <script>
        const gameData = [
            { src: 'file01.jpg', answer: 'Cleopatra' },
            { src: 'file02.png', answer: 'Great Wall of China' },
            { src: 'file03.jpg', answer: 'Isaac Newton' },
            { src: 'file04.jpg', answer: 'Henry VIII' },
            { src: 'file05.jpg', answer: 'Washington' },
            { src: 'file06.jpg', answer: 'Gettysburg' },
            { src: 'file07.jpg', answer: 'Hiroshima' },
            { src: 'file08.jpg', answer: 'French Revolution' },
            { src: 'file09.jpeg', answer: 'Printing Press' },
            { src: 'file10.jpg', answer: 'Julius Caesar' },
            { src: 'file11.jpg', answer: 'Wright brothers' },
            { src: 'file12.jpg', answer: 'Moon Landing' },
            { src: 'file13.jpeg', answer: 'Columbus' },
            { src: 'file14.jpg', answer: 'Harriet Tubman' },
            { src: 'file15.jpg', answer: 'Socrates' },
            { src: 'file16.jpeg', answer: 'Genghis Khan' }
        ];

        let currentLevel = 0;
        let tiles = [];
        let score = 48;
        let gameTimer;

        const imageEl = document.getElementById('target-image');
        const gridEl = document.getElementById('grid-overlay');
        const guessInput = document.getElementById('guessInput');
        const feedback = document.getElementById('feedback');
        const scoreBoard = document.getElementById('score-board');

        function initLevel() {
            if (currentLevel >= gameData.length) {
                feedback.innerHTML = "🏆 Course Completed!";
                clearInterval(gameTimer);
                return;
            }
            
            // Reset state
            clearInterval(gameTimer);
            score = 48;
            updateScoreBoard();
            imageEl.src = gameData[currentLevel].src;
            guessInput.value = '';
            guessInput.disabled = false;
            feedback.innerHTML = '';
            gridEl.innerHTML = '';
            tiles = [];

            // Create 48 tiles
            for (let i = 0; i < 48; i++) {
                const tile = document.createElement('div');
                tile.classList.add('tile');
                gridEl.appendChild(tile);
                tiles.push(tile);
            }

            // Start the 2-second timer
            gameTimer = setInterval(gameTick, 2000);
        }

        function gameTick() {
            if (score > 0) {
                revealRandomTile();
                score -= 2;
                updateScoreBoard();
            } else {
                // Out of points
                clearInterval(gameTimer);
                revealAllTiles();
                guessInput.disabled = true;
                feedback.innerHTML = `Time's up! The answer was <span class="answer-reveal">${gameData[currentLevel].answer}</span>. Next in 4s...`;
                setTimeout(nextLevel, 4000);
            }
        }

        function revealRandomTile() {
            const hiddenTiles = tiles.filter(t => !t.classList.contains('revealed'));
            if (hiddenTiles.length > 0) {
                const rand = Math.floor(Math.random() * hiddenTiles.length);
                hiddenTiles[rand].classList.add('revealed');
            }
        }

        function revealAllTiles() {
            tiles.forEach(t => t.classList.add('revealed'));
        }

        function updateScoreBoard() {
            scoreBoard.textContent = `Points: ${score}`;
        }

        function checkAnswer() {
            const userGuess = guessInput.value.trim().toLowerCase();
            const correctAnswer = gameData[currentLevel].answer.toLowerCase();

            if (userGuess === correctAnswer) {
                clearInterval(gameTimer); // Stop timer
                revealAllTiles();
                feedback.style.color = "green";
                feedback.textContent = `Correct! Score: ${score}`;
                setTimeout(nextLevel, 2000);
            } else {
                feedback.style.color = "red";
                feedback.textContent = "Incorrect, keep watching...";
                setTimeout(() => { feedback.textContent = ''; }, 1000);
            }
        }

        function nextLevel() {
            currentLevel++;
            initLevel();
            guessInput.focus();
        }

        guessInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") checkAnswer();
        });

        initLevel();
    </script>
</body>
</html>
