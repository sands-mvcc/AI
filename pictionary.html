<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History Reveal Challenge</title>
    <style>
        :root {
            --brand-green: #008000;
        }
        body {
            font-family: 'Arial', sans-serif;
            background-color: white;
            color: black;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h1 { color: var(--brand-green); border-bottom: 3px solid black; }

        #game-wrapper {
            position: relative;
            width: 600px;
            height: 400px;
            border: 4px solid black;
            background-color: #000;
        }

        #target-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        #grid-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(6, 1fr);
        }

        .tile {
            background-color: var(--brand-green);
            border: 1px solid black;
            transition: opacity 0.4s;
        }

        .revealed { opacity: 0; }

        .ui-panel {
            margin-top: 20px;
            text-align: center;
            width: 600px;
        }

        input[type="text"] {
            padding: 10px;
            width: 60%;
            border: 2px solid black;
            font-size: 1.1rem;
        }

        button {
            padding: 10px 20px;
            background-color: black;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover { background-color: var(--brand-green); }

        #feedback { margin-top: 10px; font-weight: bold; height: 20px; }
    </style>
</head>
<body>

    <h1>History Reveal Game</h1>
    
    <div id="game-wrapper">
        <img id="target-image" src="" alt="Game Image">
        <div id="grid-overlay"></div>
    </div>

    <div class="ui-panel">
        <div id="feedback"></div>
        <p>Type your guess below:</p>
        <input type="text" id="guessInput" placeholder="Who or what is this?">
        <br><br>
        <button onclick="revealRandomTile()">Reveal More</button>
        <button onclick="checkAnswer()">Submit Guess</button>
    </div>

    <script>
        // Your data list
        const gameData = [
            { src: 'file01.jpg', answer: 'Cleopatra' },
            { src: 'file02.png', answer: 'Great Wall of China' },
            { src: 'file03.jpg', answer: 'Isaac Newton' },
            { src: 'file04.jpg', answer: 'Henry VIII' },
            { src: 'file05.jpg', answer: 'Washington' },
            { src: 'file06.jpg', answer: 'Gettysburg' },
            { src: 'file07.jpg', answer: 'Hiroshima' },
            { src: 'file08.jpg', answer: 'French Revolution' },
            { src: 'file09.jpeg', answer: 'Printing Press' },
            { src: 'file10.jpg', answer: 'Julius Caesar' },
            { src: 'file11.jpg', answer: 'Wright brothers' },
            { src: 'file12.jpg', answer: 'Moon Landing' },
            { src: 'file13.jpeg', answer: 'Columbus' },
            { src: 'file14.jpg', answer: 'Harriet Tubman' },
            { src: 'file15.jpg', answer: 'Socrates' },
            { src: 'file16.jpeg', answer: 'Genghis Khan' }
        ];

        let currentLevel = 0;
        let tiles = [];

        const imageEl = document.getElementById('target-image');
        const gridEl = document.getElementById('grid-overlay');
        const guessInput = document.getElementById('guessInput');
        const feedback = document.getElementById('feedback');

        function initLevel() {
            if (currentLevel >= gameData.length) {
                alert("You've completed all levels!");
                return;
            }
            
            // Set image and clear input
            imageEl.src = gameData[currentLevel].src;
            guessInput.value = '';
            feedback.textContent = '';
            gridEl.innerHTML = '';
            tiles = [];

            // Create 48 tiles (8x6 grid)
            for (let i = 0; i < 48; i++) {
                const tile = document.createElement('div');
                tile.classList.add('tile');
                gridEl.appendChild(tile);
                tiles.push(tile);
            }
        }

        function revealRandomTile() {
            const hiddenTiles = tiles.filter(t => !t.classList.contains('revealed'));
            if (hiddenTiles.length > 0) {
                const rand = Math.floor(Math.random() * hiddenTiles.length);
                hiddenTiles[rand].classList.add('revealed');
            }
        }

        function checkAnswer() {
            const userGuess = guessInput.value.trim().toLowerCase();
            const correctAnswer = gameData[currentLevel].answer.toLowerCase();

            if (userGuess === correctAnswer) {
                feedback.style.color = "green";
                feedback.textContent = "Correct! Loading next...";
                setTimeout(() => {
                    currentLevel++;
                    initLevel();
                }, 1500);
            } else {
                feedback.style.color = "red";
                feedback.textContent = "Not quite. Try again or reveal more!";
            }
        }

        // Allow "Enter" key to submit
        guessInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                checkAnswer();
            }
        });

        // Start the game
        initLevel();
    </script>
</body>
</html>
