<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI for CTE Faculty | 8-Week Online Course</title>
<style>
:root{
  --navy:#0047AB;--navy-mid:#003a8c;--navy-light:#1a5fc4;
  --green:#00a86b;--green-light:#00c97e;--green-pale:#e6f9f2;
  --warn:#c45f0e;--warn-pale:#fdf2e9;--red:#c0392b;--red-pale:#fdecea;
  --text:#1c2a44;--text-2:#1a3a7a;--muted:#4a5f85;
  --bg:#f0f4fa;--card:#ffffff;--alt:#e0e8f5;--border:#b8cae4;
  --hero-text:#ffffff;--hero-sub:#c3d4f2;
  --shadow:0 4px 14px rgba(0,40,110,.08);
  --serif:Georgia,'Times New Roman',serif;
  --sans:Arial,Helvetica,sans-serif;
  --narrow:'Arial Narrow',Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --navy:#0b3c8f;--navy-mid:#08306f;--navy-light:#2d6fd6;
    --green:#14c487;--green-light:#3ad89e;--green-pale:#0d2a1f;
    --warn:#f0a050;--warn-pale:#3a2410;--red:#f07a6e;--red-pale:#3a1614;
    --text:#e2eaf8;--text-2:#a9c2ec;--muted:#8aa3cc;
    --bg:#071430;--card:#0d1f47;--alt:#0a1a3d;--border:#24427e;
    --hero-sub:#a9c2ec;--shadow:0 4px 14px rgba(0,0,0,.35);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --navy:#0b3c8f;--navy-mid:#08306f;--navy-light:#2d6fd6;
  --green:#14c487;--green-light:#3ad89e;--green-pale:#0d2a1f;
  --warn:#f0a050;--warn-pale:#3a2410;--red:#f07a6e;--red-pale:#3a1614;
  --text:#e2eaf8;--text-2:#a9c2ec;--muted:#8aa3cc;
  --bg:#071430;--card:#0d1f47;--alt:#0a1a3d;--border:#24427e;
  --hero-sub:#a9c2ec;--shadow:0 4px 14px rgba(0,0,0,.35);color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--text);line-height:1.65;font-size:16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:200;background:var(--navy)}
h1,h2,h3,h4{font-family:var(--serif);line-height:1.2}
p{margin-bottom:.9rem}
a{color:var(--navy-light)}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
button{font-family:var(--sans);cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 1.5rem}
.narrow{max-width:860px}

/* NAV */
.topnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:100;background:var(--navy);border-bottom:3px solid var(--green)}
.topnav .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:1rem}
.brand{display:flex;align-items:center;gap:.7rem;text-decoration:none;color:#fff;min-width:0}
.seal{width:38px;height:38px;border-radius:50%;background:var(--green);display:grid;place-items:center;font-family:var(--narrow);font-weight:900;font-size:.62rem;color:#fff;line-height:1.05;text-align:center;flex-shrink:0}
.brand-t{font-family:var(--narrow);font-weight:700;font-size:1rem;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-r{display:flex;align-items:center;gap:1rem}
.navlinks{display:flex;gap:1.2rem;list-style:none}
.navlinks a{color:#c3d4f2;text-decoration:none;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase}
.navlinks a:hover,.navlinks a.on{color:#fff;border-bottom:2px solid var(--green)}
.prog-pill{font-size:.72rem;color:#fff;background:rgba(255,255,255,.12);border-radius:20px;padding:.25rem .7rem;white-space:nowrap}
.theme-btn{background:var(--navy-light);border:1px solid var(--green);color:#fff;padding:.3rem .75rem;border-radius:20px;font-size:.75rem}
.theme-btn:hover{background:var(--green)}
@media(max-width:860px){.navlinks{display:none}}
@media(max-width:520px){.prog-pill{display:none}.brand-t{font-size:.85rem}}

/* HERO */
.hero{background:var(--navy);position:relative;overflow:hidden;color:var(--hero-text);text-align:center;padding:4.5rem 1.5rem 3.5rem}
.hero::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-55deg,transparent,transparent 40px,rgba(0,168,107,.07) 40px,rgba(0,168,107,.07) 41px);pointer-events:none}
.hero>*{position:relative}
.eyebrow{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--green-light);margin-bottom:1rem}
.hero h1{font-size:clamp(2rem,5vw,3.4rem);max-width:860px;margin:0 auto 1rem}
.hero .sub{font-size:1.05rem;color:var(--hero-sub);max-width:660px;margin:0 auto 2rem;line-height:1.7}
.cta{display:inline-block;background:var(--green);color:#fff;text-decoration:none;font-weight:700;font-size:.88rem;letter-spacing:.06em;text-transform:uppercase;padding:.85rem 2rem;border-radius:2px;border:0}
.cta:hover{background:var(--green-light)}
.cta.ghost{background:transparent;border:1px solid var(--green-light);margin-left:.5rem}

/* learning path (signature) */
.path{display:flex;justify-content:center;align-items:center;margin:2.5rem auto 0;max-width:820px;padding:0 .5rem}
.path a{position:relative;display:flex;flex-direction:column;align-items:center;text-decoration:none;color:var(--hero-sub);flex:1;min-width:0}
.path .dot{width:40px;height:40px;border-radius:50%;border:2px solid var(--green-light);display:grid;place-items:center;font-family:var(--narrow);font-weight:900;color:#fff;background:var(--navy-mid);z-index:1;transition:transform .15s}
.path a:hover .dot{transform:scale(1.12)}
.path a.done .dot{background:var(--green);border-color:var(--green)}
.path a:not(:last-child)::after{content:"";position:absolute;top:20px;left:50%;width:100%;height:2px;background:rgba(195,212,242,.35)}
.path a.done:not(:last-child)::after{background:var(--green)}
.path .lbl{font-size:.66rem;margin-top:.45rem;text-align:center;line-height:1.2;padding:0 2px}
@media(max-width:600px){.path .lbl{display:none}.path .dot{width:30px;height:30px;font-size:.8rem}.path a:not(:last-child)::after{top:15px}}

.stats{background:var(--navy);border-top:1px solid rgba(255,255,255,.12);border-bottom:3px solid var(--green);display:flex;justify-content:center;flex-wrap:wrap;padding:1rem}
.stat{display:flex;align-items:center;gap:.5rem;padding:.3rem 1.6rem;border-right:2px solid rgba(0,168,107,.3)}
.stat:last-child{border-right:0}
.stat b{font-family:var(--narrow);font-size:1.6rem;color:var(--green-light);line-height:1}
.stat span{font-size:.68rem;font-weight:700;color:var(--hero-sub);letter-spacing:.08em;text-transform:uppercase;line-height:1.2}

/* SECTIONS */
.section{padding:3.5rem 0}
.section.alt{background:var(--alt)}
.s-eyebrow{font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--green);font-weight:700;margin-bottom:.4rem}
.s-title{font-size:clamp(1.5rem,3vw,2rem);color:var(--text);margin-bottom:.4rem}
.rule{width:48px;height:3px;background:var(--green);margin:.7rem 0 1.4rem}
.s-desc{color:var(--text-2);max-width:680px;margin-bottom:2rem}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:1.4rem}
.mcard{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:1.4rem;display:flex;flex-direction:column;gap:.7rem;position:relative;overflow:hidden}
.mcard::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--green)}
.mcard:hover{box-shadow:var(--shadow)}
.mc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem}
.badge{background:var(--navy);color:#fff;font-family:var(--narrow);font-weight:900;font-size:.74rem;letter-spacing:.1em;padding:.25rem .6rem;border-radius:2px;white-space:nowrap}
.mc-ico{font-size:1.7rem;line-height:1}
.tag{font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--border);border-radius:20px;padding:.12rem .6rem;width:fit-content}
.tag.ok{color:#fff;background:var(--green);border-color:var(--green)}
.mc-title{font-family:var(--serif);font-size:1.12rem;font-weight:700;line-height:1.3}
.mc-desc{font-size:.86rem;color:var(--text-2);flex:1}
.mc-foot{border-top:1px solid var(--border);padding-top:.7rem;display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.launch{display:inline-block;background:var(--navy);color:#fff;text-decoration:none;font-weight:700;font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;padding:.55rem 1.1rem;border-radius:2px}
.launch:hover{background:var(--navy-light)}
.mini{font-size:.75rem;color:var(--muted)}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:6px;margin:1rem 0 1.4rem;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{background:var(--navy);color:#fff;text-align:left;padding:.65rem .8rem;font-weight:700;font-size:.8rem;letter-spacing:.03em}
td{padding:.6rem .8rem;border-top:1px solid var(--border);vertical-align:top}
tr:nth-child(even) td{background:var(--alt)}
td.c,th.c{text-align:center}
.dotm{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--green)}
.dotm.p{background:transparent;border:2px solid var(--green)}

/* MODULE PAGE */
.crumb{background:var(--card);border-bottom:1px solid var(--border);padding:.55rem 0;font-size:.83rem;color:var(--muted)}
.crumb a{color:var(--muted);text-decoration:none}.crumb a:hover{color:var(--navy-light)}
.crumb span.sep{margin:0 .45rem}
.crumb b{color:var(--navy-light)}
.mhero{padding:2.8rem 1.5rem 2.4rem}
.wk{display:inline-block;background:var(--green);color:#fff;font-size:.8rem;font-weight:700;padding:.35rem .95rem;border-radius:50px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:1rem}
.mhero h1{font-size:clamp(1.8rem,4.2vw,2.7rem);margin-bottom:.5rem}
.mhero .sub{font-family:var(--serif);font-style:italic;font-size:1.15rem;margin-bottom:1.2rem}
.sbadges{display:flex;flex-wrap:wrap;justify-content:center;gap:.7rem}
.sbadge{background:rgba(255,255,255,.14);padding:.4rem .9rem;border-radius:4px;font-size:.86rem}
.subnav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 63px);z-index:90;background:var(--card);border-bottom:1px solid var(--border)}
.subnav .wrap{display:flex;gap:.3rem;overflow-x:auto;padding-top:.45rem;padding-bottom:.45rem}
.subnav a{font-size:.8rem;text-decoration:none;color:var(--text-2);padding:.35rem .8rem;border-radius:20px;white-space:nowrap;border:1px solid transparent}
.subnav a:hover{border-color:var(--border);background:var(--alt)}
.msec{padding:2.4rem 0 .5rem}
.h2{font-size:1.75rem;color:var(--navy-light);text-align:center;margin-bottom:1.4rem}
.h2::after{content:"";display:block;width:60px;height:4px;background:var(--green);margin:.5rem auto 0;border-radius:2px}
:root[data-theme="dark"] .h2{color:var(--text)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .h2{color:var(--text)}}

.obj{background:var(--card);border:1px solid var(--border);border-left:5px solid var(--green);border-radius:8px;padding:1.6rem 1.9rem;box-shadow:var(--shadow)}
.obj .lead{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:1.08rem;margin-bottom:.8rem}
.obj ul{list-style:none}
.obj li{padding:.55rem 0 .55rem 1.8rem;position:relative;border-bottom:1px solid var(--border);font-size:.96rem}
.obj li:last-child{border-bottom:0}
.obj li::before{content:"✓";position:absolute;left:0;color:var(--green);font-weight:700}

/* accordion */
.acc{border:1px solid var(--border);border-radius:8px;background:var(--card);margin-bottom:1rem;overflow:hidden}
.acc>button{width:100%;display:flex;justify-content:space-between;align-items:center;background:var(--card);border:0;padding:1rem 1.3rem;font-family:var(--serif);font-size:1.15rem;font-weight:700;color:var(--text);text-align:left}
.acc>button:hover{background:var(--alt)}
.acc>button .pm{font-family:var(--sans);font-size:1.3rem;color:var(--green);transition:transform .2s}
.acc.open>button .pm{transform:rotate(45deg)}
.acc .panel{display:none;padding:0 1.3rem 1.3rem}
.acc.open .panel{display:block}

/* flip cards */
.flipgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1rem;margin-top:.6rem}
.flip{perspective:1000px;height:190px;background:none;border:0;padding:0;text-align:inherit;color:inherit}
.flip-in{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.ff,.fb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:8px;padding:1rem;display:flex;flex-direction:column;justify-content:center}
.ff{background:var(--card);border:1px solid var(--border);border-top:4px solid var(--navy-light);align-items:center;text-align:center}
.ff .t{font-family:var(--serif);font-size:1.08rem;font-weight:700;margin-bottom:.4rem}
.ff .h{font-size:.72rem;color:var(--muted)}
.fb{background:var(--navy);color:#fff;transform:rotateY(180deg);font-size:.84rem;line-height:1.5;overflow:auto;justify-content:flex-start}
.fb b{display:block;color:var(--green-light);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:.35rem}
@media (prefers-reduced-motion:reduce){.flip-in{transition:none}html{scroll-behavior:auto}}

/* tabs */
.tabs{background:var(--card);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);overflow:hidden}
.tabbar{display:flex;overflow-x:auto;border-bottom:1px solid var(--border);background:var(--alt)}
.tabbar button{border:0;background:none;padding:.85rem 1.15rem;font-size:.86rem;font-weight:700;color:var(--muted);white-space:nowrap;border-bottom:3px solid transparent}
.tabbar button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--green);background:var(--card)}
.tabpane{padding:1.6rem 1.8rem;display:none}
.tabpane.on{display:block}
.tabpane h3{font-size:1.22rem;margin:1.2rem 0 .6rem;color:var(--text)}
.tabpane h3:first-child{margin-top:0}
.tabpane ul,.tabpane ol{margin:0 0 1rem 1.3rem}
.tabpane li{margin-bottom:.35rem}
.steps{list-style:none;margin:1rem 0!important;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding:.2rem 0 .9rem 3rem;margin:0!important}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:2.1rem;height:2.1rem;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.9rem}
.steps li:not(:last-child)::after{content:"";position:absolute;left:1.02rem;top:2.2rem;bottom:0;width:2px;background:var(--border)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem;margin:1rem 0}
.box{border:1px solid var(--border);border-radius:8px;padding:1rem 1.1rem;background:var(--card)}
.box h4{font-size:1rem;margin-bottom:.4rem}
.box p,.box li{font-size:.88rem}
.box.g{border-left:4px solid var(--green)}.box.w{border-left:4px solid var(--warn)}.box.n{border-left:4px solid var(--navy-light)}
.callout{border-radius:8px;padding:1rem 1.2rem;margin:1.2rem 0;border-left:5px solid var(--green);background:var(--green-pale)}
.callout.w{border-left-color:var(--warn);background:var(--warn-pale)}
.callout b.ct{display:block;margin-bottom:.25rem}

/* interactives */
.lab{background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);margin-bottom:1.8rem;overflow:hidden}
.lab-h{background:var(--navy);color:#fff;padding:1rem 1.4rem;display:flex;gap:.8rem;align-items:center}
.lab-h .i{font-size:1.5rem}
.lab-h h3{font-size:1.18rem}
.lab-h p{margin:0;font-size:.84rem;color:var(--hero-sub)}
.lab-b{padding:1.4rem}
.btn{border:1px solid var(--navy-light);background:var(--card);color:var(--text);padding:.5rem .95rem;border-radius:4px;font-size:.86rem;font-weight:700}
.btn:hover{background:var(--alt)}
.btn.pri{background:var(--navy-light);color:#fff;border-color:var(--navy-light)}
.btn.pri:hover{background:var(--navy)}
.btn.go{background:var(--green);border-color:var(--green);color:#fff}
.btn.sel{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.right{background:var(--green);color:#fff;border-color:var(--green)}
.btn.wrong{background:var(--red);color:#fff;border-color:var(--red)}
.btnrow{display:flex;flex-wrap:wrap;gap:.5rem;margin:.7rem 0}
.fb-msg{margin-top:.8rem;padding:.75rem 1rem;border-radius:6px;font-size:.9rem;display:none}
.fb-msg.show{display:block}
.fb-msg.ok{background:var(--green-pale);border-left:4px solid var(--green)}
.fb-msg.no{background:var(--red-pale);border-left:4px solid var(--red)}
.fb-msg.info{background:var(--alt);border-left:4px solid var(--navy-light)}
label.f{display:block;font-size:.8rem;font-weight:700;color:var(--text-2);margin:.8rem 0 .3rem}
input[type=text],textarea,select{width:100%;padding:.6rem .7rem;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:.92rem}
textarea{min-height:90px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--green)}
.out{background:var(--bg);border:1px dashed var(--navy-light);border-radius:8px;padding:1rem 1.1rem;white-space:pre-wrap;font-size:.9rem;line-height:1.6;min-height:3rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:1.4rem}
@media(max-width:760px){.two{grid-template-columns:1fr}.tabpane{padding:1.2rem}}
.bar{display:flex;align-items:center;gap:.6rem;margin:.35rem 0;font-size:.88rem}
.bar .w{width:110px;flex-shrink:0;text-align:right}
.bar .track{flex:1;height:22px;background:var(--alt);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;background:var(--navy-light);transition:width .4s}
.bar .fill.pick{background:var(--green)}
.bar .pct{width:44px;font-size:.8rem;color:var(--muted)}
.meter{height:12px;border-radius:6px;background:var(--alt);overflow:hidden;margin:.4rem 0}
.meter>div{height:100%;transition:width .3s}
.chip{display:inline-block;font-size:.72rem;padding:.15rem .55rem;border-radius:20px;background:var(--alt);color:var(--text-2);margin:0 .25rem .25rem 0}
.sentence{display:block;width:100%;text-align:left;padding:.55rem .8rem;margin:.3rem 0;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:.92rem}
.sentence.flag{border-color:var(--warn);background:var(--warn-pale)}
.sentence.hit{border-color:var(--green);background:var(--green-pale)}
.sentence.miss{border-color:var(--red);background:var(--red-pale)}
.sentence .why{display:block;font-size:.8rem;margin-top:.3rem;color:var(--text-2)}

/* AIAS scale */
.aias{display:flex;flex-direction:column;gap:.5rem}
.aias button{display:flex;align-items:center;gap:1rem;border:0;border-radius:6px;padding:.8rem 1rem;color:#fff;text-align:left;font-size:.95rem;font-weight:700;transition:transform .15s}
.aias button:hover,.aias button.on{transform:translateX(8px)}
.aias button .n{font-family:var(--narrow);font-size:1.5rem;width:2rem;text-align:center}
.lv1{background:#b3261e}.lv2{background:#c8650d}.lv3{background:#8a7b00}.lv4{background:#1f7a3d}.lv5{background:#1a5fc4}

/* quiz */
.q{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:1.2rem 1.4rem;margin-bottom:1rem}
.q .stem{font-weight:700;margin-bottom:.7rem}
.q .opts{display:flex;flex-direction:column;gap:.45rem}
.q .opts button{text-align:left;border:1px solid var(--border);background:var(--bg);color:var(--text);padding:.6rem .9rem;border-radius:6px;font-size:.92rem}
.q .opts button:hover:not(:disabled){border-color:var(--navy-light)}
.q .opts button.right{background:var(--green-pale);border-color:var(--green);font-weight:700}
.q .opts button.wrong{background:var(--red-pale);border-color:var(--red)}
.q .opts button:disabled{cursor:default}
.score{text-align:center;font-family:var(--serif);font-size:1.2rem;margin:.6rem 0 1rem}

/* apply */
.apply{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.1rem}
.apply .box h4{display:flex;gap:.5rem;align-items:center}
.complete-row{text-align:center;margin:2rem 0 1rem}
.bnav{display:flex;justify-content:space-between;gap:.7rem;margin:2rem 0 3rem;flex-wrap:wrap}
.bnav a{flex:1;min-width:150px;text-align:center;text-decoration:none;padding:.8rem 1rem;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);font-weight:700;font-size:.88rem}
.bnav a:hover{border-color:var(--navy-light);background:var(--alt)}
.bnav a.dis{opacity:.4;pointer-events:none}
footer{background:var(--navy);color:var(--hero-sub);text-align:center;padding:1.8rem 1rem;font-size:.82rem;border-top:3px solid var(--green)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--green);color:#fff;padding:.6rem 1.2rem;border-radius:6px;font-weight:700;font-size:.88rem;display:none;z-index:300}
.rings{display:flex;justify-content:center;margin:.5rem 0 1rem}
.ring{border-radius:50%;border:2px solid #fff;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:10px;color:#fff;font-weight:700;font-size:.82rem;cursor:pointer;background:none}
.ring:focus-visible{outline-offset:-6px}

</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status"></div>
<script>
const COURSE = "AI for CTE Faculty";
const M = {};

/* ================= MODULE 1 ================= */
M[1] = {
 icon:"🧠", title:"AI Fundamentals", short:"Fundamentals",
 sub:"What AI is, how it learns, and why it now belongs in every career and technical program",
 card:"Build a working mental model of AI, machine learning, and large language models, and map where AI already shows up in your occupational field.",
 stats:["⏱ 3–4 hours","📋 5 topics","🧪 2 interactive labs","✅ 5-question check"],
 obj:[
  "Distinguish artificial intelligence, machine learning, deep learning, and generative AI, and explain how they nest inside each other.",
  "Explain in plain language how a large language model produces text by predicting the next token.",
  "Describe supervised, unsupervised, and reinforcement learning using examples from CTE fields.",
  "Identify AI already embedded in the tools, equipment, and software of your occupational area.",
  "Summarize what current AI does well and where it fails, including hallucination and knowledge cutoffs.",
  "Make the case to students and colleagues that AI literacy is a workforce competency."
 ],
 terms:[
  ["Artificial Intelligence","The broad field of building computer systems that perform tasks normally requiring human intelligence: recognizing patterns, making predictions, understanding language, and making decisions."],
  ["Machine Learning","A subset of AI in which systems learn patterns from data instead of following hand-written rules. The model improves as it sees more examples."],
  ["Deep Learning","Machine learning that uses many-layered neural networks. It powers image recognition, speech recognition, and modern language models."],
  ["Generative AI","AI that creates new content — text, images, audio, video, or code — based on patterns learned from training data."],
  ["Large Language Model (LLM)","A deep learning model trained on very large amounts of text to predict the next token. ChatGPT, Claude, Gemini, and Copilot are built on LLMs."],
  ["Token","The unit of text an LLM reads and writes, often a word or part of a word. Roughly 100 tokens ≈ 75 English words."],
  ["Training Data","The examples a model learns from. Its quality, coverage, and bias shape everything the model later produces."],
  ["Parameters","The internal numeric weights a model adjusts during training. Large models have billions of them."],
  ["Inference","Using a trained model to produce an output, such as answering your prompt. Training happens once; inference happens every time you use it."],
  ["Hallucination","Output that sounds confident and plausible but is false or fabricated, such as an invented statistic or citation."],
  ["Supervised Learning","Learning from labeled examples (input + correct answer), such as photos of welds labeled “acceptable” or “defective.”"],
  ["Knowledge Cutoff","The date after which a model has no training data. Without web search, it cannot know about later events, codes, or standards."]
 ],
 tabs:[
  ["The AI family tree",`<h3>Four nested ideas</h3>
<p>People use “AI” to mean very different things. A clear vocabulary helps you explain it to students and evaluate vendor claims. Think of four nested circles: <strong>artificial intelligence</strong> is the whole field; <strong>machine learning</strong> is the part that learns from data; <strong>deep learning</strong> is machine learning with large neural networks; <strong>generative AI</strong> is deep learning that creates new content.</p>
<div class="tbl-wrap"><table><tr><th>Era</th><th>Approach</th><th>Example you’d recognize</th></tr>
<tr><td>1950s–1980s</td><td>Rule-based “expert systems”: if–then logic written by people</td><td>Early diagnostic software, troubleshooting decision trees</td></tr>
<tr><td>1990s–2000s</td><td>Statistical machine learning</td><td>Spam filters, credit scoring, recommendation engines</td></tr>
<tr><td>2012 onward</td><td>Deep learning with neural networks</td><td>Image recognition, speech-to-text, lane-keeping assist</td></tr>
<tr><td>2017 onward</td><td>Transformer architecture</td><td>The design behind today’s language models</td></tr>
<tr><td>2022 onward</td><td>Generative AI goes mainstream</td><td>ChatGPT, Claude, Gemini, Copilot, image and video generators</td></tr></table></div>
<div class="callout"><b class="ct">Faculty tip</b>Use the lab below in your first class session. Students consistently overestimate what counts as AI (“the calculator is AI”) and underestimate where it hides (their phone’s keyboard, their car’s braking system).</div>`],
  ["How machines learn",`<h3>Three ways a machine learns</h3>
<div class="tbl-wrap"><table><tr><th>Type</th><th>How it learns</th><th>CTE example</th></tr>
<tr><td><strong>Supervised</strong></td><td>From labeled examples with known answers</td><td>A vision system trained on thousands of labeled weld photos flags porosity and undercut on a production line.</td></tr>
<tr><td><strong>Unsupervised</strong></td><td>Finds patterns and groupings in unlabeled data</td><td>Clustering HVAC sensor readings to discover unusual operating patterns no one had named yet.</td></tr>
<tr><td><strong>Reinforcement</strong></td><td>Tries actions and is rewarded or penalized</td><td>A warehouse robot learns efficient pick paths; a building system learns to cut energy use while holding temperature.</td></tr></table></div>
<p>Large language models combine these: they first learn from enormous amounts of unlabeled text (self-supervised), then are refined with human feedback so their answers are more helpful and safer.</p>
<div class="callout w"><b class="ct">Why this matters for your students</b>Every model is only as good as its training data. A defect-detection model trained only on steel will struggle on aluminum. That is a concept your students can test, explain, and troubleshoot — exactly the kind of judgment employers want.</div>`],
  ["How an LLM works",`<h3>From your prompt to its answer</h3>
<ol class="steps">
<li><strong>Tokenize.</strong> Your prompt is split into tokens — words and word pieces.</li>
<li><strong>Represent.</strong> Each token becomes a list of numbers (an embedding) that captures meaning and relationships.</li>
<li><strong>Pay attention.</strong> The transformer weighs how every token relates to every other token in the context.</li>
<li><strong>Predict.</strong> The model calculates a probability for every possible next token.</li>
<li><strong>Sample and repeat.</strong> One token is chosen, added to the text, and the process repeats until the answer is complete.</li></ol>
<p>The key insight: an LLM is not looking facts up in a database. It is generating the most plausible continuation. That is why it can write fluently about almost anything, and also why it can be fluently wrong. Try the next-word predictor in the Interact section to see this happen.</p>`],
  ["AI in CTE fields",`<h3>AI is already on the job</h3>
<div class="cols">
<div class="box n"><h4>🚗 Automotive</h4><p>Advanced driver-assistance systems, AI-assisted diagnostics, predictive fleet maintenance.</p></div>
<div class="box n"><h4>🏥 Health sciences</h4><p>Imaging triage, ambient clinical documentation, early-warning scores for patient deterioration.</p></div>
<div class="box n"><h4>🏭 Manufacturing</h4><p>Machine-vision quality inspection, predictive maintenance, collaborative robots.</p></div>
<div class="box n"><h4>🔥 Welding</h4><p>Automated weld inspection, AI-guided welding simulators, adaptive robotic welding.</p></div>
<div class="box n"><h4>❄️ HVAC & energy</h4><p>Fault detection and diagnostics, smart thermostats, building energy optimization.</p></div>
<div class="box n"><h4>🍽 Hospitality</h4><p>Demand forecasting, inventory and menu optimization, guest-service chat agents.</p></div>
<div class="box n"><h4>💼 Business</h4><p>Forecasting, document drafting, customer-service agents, fraud detection.</p></div>
<div class="box n"><h4>🛡 IT & cybersecurity</h4><p>Threat detection, log analysis, AI coding assistants, and new attacks that use AI.</p></div>
<div class="box n"><h4>🌾 Agriculture</h4><p>Precision spraying, yield prediction, drone and satellite crop monitoring.</p></div>
</div>`],
  ["Capabilities & limits",`<div class="two">
<div class="box g"><h4>What current AI does well</h4><ul>
<li>Drafting, summarizing, and rewriting text at many reading levels</li>
<li>Generating examples, scenarios, and practice questions</li>
<li>Explaining concepts several different ways</li>
<li>Writing and explaining code</li>
<li>Recognizing patterns in images, audio, and sensor data</li>
<li>Brainstorming and organizing ideas quickly</li></ul></div>
<div class="box w"><h4>Where it fails</h4><ul>
<li>Inventing facts, specifications, and citations (hallucination)</li>
<li>Outdated information past its knowledge cutoff</li>
<li>Arithmetic and multi-step calculations without tools</li>
<li>Reflecting bias in its training data</li>
<li>Knowing your local codes, equipment, and shop procedures</li>
<li>Accountability — it cannot sign off on safety-critical work</li></ul></div></div>
<div class="callout w"><b class="ct">The rule for this course</b>AI drafts; qualified humans decide. You will build on this idea in Module 5.</div>`]
 ],
 quiz:[
  ["Which statement best describes how AI terms relate to one another?",["Generative AI and machine learning are separate, unrelated fields","Generative AI is a subset of deep learning, which is a subset of machine learning, which is part of AI","Machine learning is a subset of generative AI","Deep learning is the broadest category and includes all AI"],1,"The circles nest: AI ⊃ machine learning ⊃ deep learning ⊃ generative AI."],
  ["When an LLM answers a question, it is fundamentally…",["Looking the answer up in a verified database","Searching the internet every time","Predicting likely next tokens from patterns learned in training","Running a rule set written by experts"],2,"LLMs generate the most plausible continuation token by token. Some tools add web search, but the core model predicts text."],
  ["A predictive-maintenance model is trained on years of motor sensor data labeled “failed within 30 days” or “did not fail.” What type of learning is this?",["Supervised learning","Unsupervised learning","Reinforcement learning","Rule-based programming"],0,"Labeled examples with known outcomes are the defining feature of supervised learning."],
  ["A chatbot gives a student a confident torque specification and cites a service bulletin that does not exist. This is an example of…",["A knowledge cutoff","Reinforcement learning","Hallucination","Tokenization"],2,"Plausible but fabricated facts and sources are hallucinations — the reason every safety-critical value must be verified against the manufacturer’s documentation."],
  ["Which is the strongest reason AI literacy belongs in CTE programs?",["AI will replace the need for technical skills","Employers are embedding AI into the tools and workflows graduates will use, and graduates must be able to use and evaluate it","Accreditors require a standalone AI course","Students already know how to use AI well"],1,"AI is becoming part of everyday occupational tools. Graduates need to use it productively and judge when it is wrong."]
 ],
 apply:{
  assign:"<strong>AI in My Field Scan.</strong> Find three concrete examples of AI used in your occupation: one from a job posting, one from an industry publication or equipment vendor, and one from a conversation with an advisory board member or employer. For each, note what the AI does, what humans still do, and one skill your students would need.",
  discuss:"Share the most surprising example from your scan. What does it suggest you should add to, or remove from, your current curriculum?",
  capstone:"Choose the course you will redesign during these eight weeks. Write a short context statement: course title, students served, two or three key outcomes, and where AI already touches that occupation.",
  journal:"Before this week, how would you have defined AI for a student? How would you define it now?"
 }
};

/* ================= MODULE 2 ================= */
M[2] = {
 icon:"💬", title:"Using LLMs", short:"Using LLMs",
 sub:"Choosing, configuring, and working productively with ChatGPT, Claude, Gemini, Copilot, and their peers",
 card:"Compare the major chat assistants, learn how context windows and power features work, and set up FERPA-aware habits before you use AI with course materials.",
 stats:["⏱ 3–4 hours","📋 4 topics","🧪 2 interactive labs","✅ 5-question check"],
 obj:[
  "Compare major LLM platforms by strengths, data practices, and availability through your institution.",
  "Explain context windows, model versions, and knowledge cutoffs, and how each affects results.",
  "Manage conversations deliberately: iterate, branch, and start fresh when a thread drifts.",
  "Use file uploads, projects, custom instructions, and web search appropriately.",
  "Apply FERPA-aware practices and privacy settings when using LLMs with course content.",
  "Select an appropriate assistant and feature for a given teaching task."
 ],
 terms:[
  ["Context Window","The amount of text (in tokens) a model can consider at once — your prompts, uploaded files, and its own replies. Beyond it, earlier material drops out."],
  ["Custom Instructions","Standing guidance you give an assistant (your role, audience, tone) that is applied to every conversation."],
  ["Project / Workspace","A space that keeps reference files and instructions together so every chat inside it starts with that context."],
  ["Multimodal","Able to work with more than text — reading images and PDFs, listening to audio, or producing images."],
  ["Reasoning Mode","A setting in which the model works through a problem step by step before answering. Slower, often more accurate on complex tasks."],
  ["Web Search / Grounding","A feature that lets the assistant retrieve current web pages and cite them, reducing reliance on training data alone."],
  ["Temperature","A setting controlling randomness. Low = consistent and predictable; high = more varied and creative."],
  ["RAG","Retrieval-augmented generation: the system pulls relevant passages from your documents and feeds them to the model before it answers."],
  ["Enterprise / Education License","An institutional agreement that typically adds data protections, such as not using your conversations to train models."],
  ["Data Retention","How long a provider stores your conversations and files, and who can access them. Check before uploading anything sensitive."]
 ],
 tabs:[
  ["The landscape",`<h3>The major assistants</h3>
<p>All of these are capable; differences are in features, integrations, and data terms. Plans and features change every few months, so treat this as orientation and check what your institution licenses.</p>
<div class="tbl-wrap"><table><tr><th>Assistant</th><th>Often chosen for</th><th>Teaching fit</th><th>Check before use</th></tr>
<tr><td><strong>ChatGPT</strong> (OpenAI)</td><td>Broad features, image generation, custom GPTs</td><td>General drafting, tutoring bots, image creation</td><td>Whether chats are used for training on your plan</td></tr>
<tr><td><strong>Claude</strong> (Anthropic)</td><td>Long documents, careful writing, building interactive artifacts and code</td><td>Analyzing syllabi and standards, building interactive learning tools</td><td>Plan features and data settings</td></tr>
<tr><td><strong>Gemini</strong> (Google)</td><td>Google Workspace integration</td><td>Docs, Slides, and Classroom-centered courses</td><td>Workspace admin settings at your college</td></tr>
<tr><td><strong>Microsoft Copilot</strong></td><td>Microsoft 365 integration</td><td>Word, PowerPoint, Excel, and Teams workflows</td><td>Which Copilot your account includes</td></tr>
<tr><td><strong>Perplexity</strong></td><td>Search-first answers with citations</td><td>Quick research with sources to verify</td><td>Citations still need checking</td></tr>
<tr><td><strong>Open-weight models</strong> (Llama, Mistral, others)</td><td>Running locally or on your own servers</td><td>Privacy-sensitive data, IT and programming courses</td><td>Hardware needs and capability gaps</td></tr></table></div>
<div class="callout"><b class="ct">Start here</b>Ask your IT or teaching and learning center which tools your college licenses. A licensed tool with education data terms is almost always the right default for faculty work.</div>`],
  ["Anatomy of a session",`<h3>Working memory, not permanent memory</h3>
<p>Everything in a conversation — your instructions, files, and every reply — shares one context window. Long, wandering threads cause trouble: early instructions get diluted, details get mixed up, and quality drops.</p>
<ol class="steps">
<li><strong>Set the frame.</strong> State your role, audience, and goal in the first message.</li>
<li><strong>Iterate in place.</strong> Refine with specific feedback: “Make question 3 harder and add a distractor about voltage drop.”</li>
<li><strong>Branch.</strong> Edit an earlier message to try a different direction without polluting the thread.</li>
<li><strong>Start fresh.</strong> When the topic changes or answers drift, open a new chat and paste a short summary of what matters.</li>
<li><strong>Reuse context.</strong> Put recurring files (syllabus, outcomes, standards) in a project so you don’t re-upload every time.</li></ol>`],
  ["Power features",`<div class="cols">
<div class="box n"><h4>📎 File upload</h4><p>Analyze a syllabus, standards document, lab manual, or spreadsheet. Ask for alignment gaps or a summary for students.</p></div>
<div class="box n"><h4>🗂 Projects</h4><p>Keep course files and instructions in one place so every chat starts informed.</p></div>
<div class="box n"><h4>⚙️ Custom instructions</h4><p>“I teach first-year HVAC students; write at an 8th–10th grade reading level and use shop examples.”</p></div>
<div class="box n"><h4>🌐 Web search</h4><p>Current regulations, recent product information, and sources you can verify.</p></div>
<div class="box n"><h4>🖼 Image input</h4><p>Photograph a wiring diagram, failed part, or whiteboard and ask questions about it.</p></div>
<div class="box n"><h4>🎙 Voice</h4><p>Practice interviews or customer conversations; talk through ideas while commuting.</p></div>
<div class="box n"><h4>🧩 Artifacts / canvas</h4><p>Build documents, quizzes, and small interactive web tools side by side with the chat.</p></div>
<div class="box n"><h4>🧠 Reasoning modes</h4><p>Complex troubleshooting, calculations, and multi-step planning.</p></div></div>`],
  ["Privacy & FERPA",`<div class="two">
<div class="box g"><h4>Do</h4><ul>
<li>Use institution-licensed tools with education data terms</li>
<li>Remove names, IDs, and other identifiers before pasting student work</li>
<li>Turn off model training on your data where the setting exists</li>
<li>Tell students which tools are approved and why</li>
<li>Keep a record of how AI was used to make course materials</li></ul></div>
<div class="box w"><h4>Don’t</h4><ul>
<li>Paste grades, accommodations, or identifiable student work into consumer tools</li>
<li>Upload copyrighted textbooks or paid content you aren’t licensed to share</li>
<li>Require students to create accounts on tools that haven’t been vetted</li>
<li>Assume “private” mode means data isn’t stored</li></ul></div></div>
<div class="callout w"><b class="ct">Check your local policy</b>FERPA sets the baseline, but your college may have stricter AI and data policies. This module is not legal advice; your compliance office has the final word.</div>`]
 ],
 quiz:[
  ["Halfway through a long chat, the assistant starts ignoring the reading-level instruction you gave at the start. What is the most likely cause?",["The model was updated mid-conversation","The original instruction is losing influence as the context fills","Reading-level instructions are not supported","The assistant is refusing on purpose"],1,"Long threads dilute early instructions. Restate the requirement or start a fresh chat with a summary."],
  ["You need the current NFPA 70E requirements summarized with sources. Which feature matters most?",["Image generation","Voice mode","Web search with citations","High temperature"],2,"Current standards may post-date the model’s training. Web search with citations lets you verify against the source."],
  ["Which practice is most consistent with FERPA?",["Pasting a student’s graded essay with name into a free consumer chatbot","Using a licensed tool and removing identifiers before analyzing anonymized work samples","Uploading the class roster to generate personalized emails","Sharing accommodation letters to get teaching suggestions"],1,"De-identify and use institution-approved tools. Identifiable education records don’t belong in unvetted tools."],
  ["What does a project or workspace give you that a single chat does not?",["Guaranteed accuracy","Persistent reference files and instructions applied to every chat in it","Unlimited context","Automatic citation checking"],1,"Projects keep course context in one place so you don’t re-upload your syllabus and outcomes every time."],
  ["You want the same quiz-generation output each time for consistency. Which setting helps?",["Higher temperature","Lower temperature","A longer prompt","Voice mode"],1,"Lower temperature makes outputs more consistent. Where you can’t set it directly, ask for a fixed format and give an example."]
 ],
 apply:{
  assign:"<strong>Same task, three models.</strong> Give the same request to two or three assistants — for example, “Create 10 scenario-based practice questions on lockout/tagout for first-year students, with answer explanations.” Score each on accuracy, alignment, reading level, and usefulness, and note which errors you had to catch.",
  discuss:"Which assistant would you recommend to a colleague in your program, and for what kind of task? Where did all of them struggle?",
  capstone:"Set up a project or workspace for your capstone course. Add your de-identified syllabus, outcomes, and any industry standards, and write custom instructions describing your students.",
  journal:"What privacy practice will you change starting this week?"
 }
};
/* ================= MODULE 3 ================= */
M[3] = {
 icon:"🧰", title:"Overview of Other AI Tools", short:"Other AI tools",
 sub:"Beyond chat: image, audio, video, research, coding, and agentic tools for the CTE classroom and workplace",
 card:"Survey the wider AI toolbox, vet tools before adopting them, and identify the industry AI your students will meet on the job.",
 stats:["⏱ 3–4 hours","📋 4 topics","🧪 2 interactive labs","✅ 5-question check"],
 obj:[
  "Categorize AI tools by what they take in and what they produce.",
  "Evaluate a tool with a vetting scorecard covering privacy, accessibility, accuracy, cost, and support.",
  "Identify occupation-specific AI tools students will encounter in industry.",
  "Use source-grounded research assistants and verify the sources they cite.",
  "Explain what AI agents are and why actions require more oversight than answers.",
  "Assemble a short, vetted tool list for one course."
 ],
 terms:[
  ["Text-to-Image","Tools that generate images from a written description. Useful for scenario visuals; risky for technical accuracy."],
  ["Speech-to-Text","Transcription tools that turn audio into text — lecture captions, meeting notes, and interview transcripts."],
  ["Text-to-Speech","Tools that read text aloud in natural voices. Valuable for accessibility and narrated demonstrations."],
  ["Voice Cloning","Synthesizing speech in a specific person’s voice. Requires consent and raises fraud and deepfake concerns."],
  ["AI Video","Tools that generate video from text or create presenter-style videos from a script."],
  ["Source-Grounded Assistant","A tool that answers only from documents you provide and cites where in them each answer came from."],
  ["Coding Assistant","AI that writes, explains, and debugs code inside an editor or chat."],
  ["AI Agent","A system that can plan and take actions — browse, click, send, file — toward a goal, not just answer questions."],
  ["Deepfake","Realistic synthetic media depicting someone saying or doing something they did not."],
  ["Accessibility AI","Tools that generate alt text, captions, transcripts, and simplified versions of content."]
 ],
 tabs:[
  ["Tool categories",`<p>Names change quickly; categories don’t. Learn the categories and you can evaluate whatever appears next semester. Tool names below are common examples, not endorsements.</p>
<div class="tbl-wrap"><table><tr><th>Category</th><th>Examples</th><th>Classroom use</th></tr>
<tr><td>Research with citations</td><td>Perplexity, Elicit, Consensus</td><td>Finding sources to read and verify</td></tr>
<tr><td>Source-grounded notebooks</td><td>NotebookLM</td><td>Study guides and audio overviews from your own course documents</td></tr>
<tr><td>Images & design</td><td>Adobe Firefly, Canva, ChatGPT images</td><td>Scenario illustrations, slide visuals, signage</td></tr>
<tr><td>Presentations</td><td>Gamma, Copilot in PowerPoint</td><td>First-draft decks you then correct and brand</td></tr>
<tr><td>Audio & voice</td><td>ElevenLabs, Descript</td><td>Narration, podcast-style reviews, editing recorded demos</td></tr>
<tr><td>Transcription</td><td>Otter, Microsoft Teams, Zoom AI</td><td>Captions, meeting notes, lecture transcripts</td></tr>
<tr><td>Video</td><td>Synthesia, Descript, Runway</td><td>Short explainer and safety-briefing videos</td></tr>
<tr><td>Coding</td><td>GitHub Copilot, Claude Code, Cursor</td><td>Programming courses; building your own interactive tools</td></tr>
<tr><td>Agents</td><td>Browser and desktop agents</td><td>Multi-step tasks; requires close supervision</td></tr></table></div>`],
  ["Industry AI",`<h3>The tools on the job site</h3>
<p>Your students need practice with the AI built into occupational equipment and software, not only chat assistants. Ask your advisory board which of these they use.</p>
<div class="cols">
<div class="box n"><h4>Automotive</h4><p>Scan tools with guided diagnostics; ADAS calibration systems.</p></div>
<div class="box n"><h4>Health sciences</h4><p>Ambient documentation in the EHR; clinical decision support alerts.</p></div>
<div class="box n"><h4>Manufacturing</h4><p>Vision inspection, predictive maintenance dashboards, cobot programming.</p></div>
<div class="box n"><h4>Construction</h4><p>Drone surveying, BIM clash detection, AI-based estimating.</p></div>
<div class="box n"><h4>Business & office</h4><p>Copilot or Gemini in office suites, CRM assistants, AI bookkeeping.</p></div>
<div class="box n"><h4>IT & cybersecurity</h4><p>AI-enabled security monitoring, help-desk agents, code assistants.</p></div></div>`],
  ["Vetting a tool",`<h3>Before you adopt — and before students sign up</h3>
<ol class="steps">
<li><strong>Purpose.</strong> Does it serve a specific learning outcome better than what you already have?</li>
<li><strong>Privacy.</strong> What data does it collect? Is it trained on user content? Is there an education agreement?</li>
<li><strong>Accessibility.</strong> Does it work with screen readers and keyboards? Does it caption?</li>
<li><strong>Accuracy.</strong> Test it on content you know well. How often is it wrong, and how obviously?</li>
<li><strong>Cost and equity.</strong> Can every student use it without paying or owning special hardware?</li>
<li><strong>Durability.</strong> Is the company stable? Can you export your work if it disappears?</li></ol>
<p>Use the scorecard in the Interact section to rate a tool in about five minutes.</p>`],
  ["Agents",`<h3>From answers to actions</h3>
<p>A chatbot gives you text to review. An agent <em>does</em> things: it browses, fills in forms, edits files, sends messages, or runs code. That shift raises the stakes, because mistakes happen in the real world before a person sees them.</p>

 tabs:[
  ["The HITL loop",`<p>Human in the loop is not a single review at the end. It is a set of deliberate checkpoints where qualified people make the decisions that matter.</p>
<ol class="steps">
<li><strong>Define.</strong> A human sets the goal, outcome, audience, and acceptable sources.</li>
<li><strong>Generate.</strong> AI drafts content, data, or code.</li>
<li><strong>Verify.</strong> A subject-matter expert checks facts, values, procedures, and citations against ground truth.</li>
<li><strong>Revise.</strong> The human corrects, localizes, and adapts the draft to the course and shop.</li>
<li><strong>Approve.</strong> A named person takes responsibility before students see it.</li>
<li><strong>Monitor.</strong> Student questions and results reveal remaining errors; fix and document them.</li></ol>

  ["Error patterns",`<div class="tbl-wrap"><table><tr><th>Error type</th><th>What it looks like</th><th>CTE example</th></tr>
<tr><td>Fabrication</td><td>Invented facts, specs, quotes, or sources</td><td>A torque value or part number that doesn’t exist</td></tr>
<tr><td>Outdated</td><td>Was true before the knowledge cutoff</td><td>A superseded code edition or refrigerant rule</td></tr>
<tr><td>Calculation</td><td>Wrong arithmetic, units, or conversions</td><td>Ohm’s law answer off by a factor; psi vs. kPa confusion</td></tr>
<tr><td>Overgeneralization</td><td>A general rule applied where it doesn’t fit</td><td>Advice that ignores manufacturer-specific procedures</td></tr>
<tr><td>Bias</td><td>Stereotyped or one-sided content</td><td>Scenarios that always cast nurses as women and welders as men</td></tr>

<tr><td>Unsafe omission</td><td>Missing a critical step or warning</td><td>A repair procedure without lockout/tagout</td></tr></table></div>`],
  ["Verification toolkit",`<div class="cols">
<div class="box n"><h4>S — Stop</h4><p>Pause before using it. Ask: do I know this to be true? What would happen if it’s wrong?</p></div>
<div class="box n"><h4>I — Investigate the source</h4><p>Does the cited source exist? Is it authoritative for this claim?</p></div>
<div class="box n"><h4>F — Find better coverage</h4><p>Read laterally: manufacturer documentation, code books, agency sites, textbooks.</p></div>
<div class="box n"><h4>T — Trace claims</h4><p>Follow statistics and quotes back to the original publication.</p></div></div>
<h3>Practical habits</h3><ul>
<li>Ask the AI to list every factual claim and number it used, then check that list.</li>
<li>Search each citation by exact title; fabricated papers usually return nothing.</li>
<li>Recompute every calculation yourself or with a spreadsheet.</li>
<li>Have a colleague or advisory board member review high-stakes content.</li></ul>`],

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = (r, s) => r.querySelector(s), $$ = (r, s) => [...r.querySelectorAll(s)];
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",1800);}
function copyText(txt){
  const done=()=>toast("Copied to clipboard");
  const fallback=()=>{const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done();}catch(e){toast("Select the text and copy it manually");}ta.remove();};
  try{navigator.clipboard.writeText(txt).then(done,fallback);}catch(e){fallback();}
}
/* generic single-choice sorter: items [{q, a(index), why}], choices [labels] */
function sorterHTML(items, choices){
  return items.map((it,i)=>`<div class="q" data-i="${i}"><div class="stem">${it.q}</div><div class="btnrow">${choices.map((c,j)=>`<button class="btn" data-j="${j}">${c}</button>`).join("")}</div><div class="fb-msg"></div></div>`).join("")+`<div class="score" aria-live="polite"></div>`;
}
function sorterInit(root, items, choices){
  let right=0, done=0;
  $$(root,".q").forEach(qe=>{
    const it=items[+qe.dataset.i];
    $$(qe,".btn").forEach(b=>b.addEventListener("click",()=>{
      if(qe.dataset.done) return; qe.dataset.done=1; done++;
      const j=+b.dataset.j, ok = j===it.a;
      if(ok) right++;
      b.classList.add(ok?"right":"wrong");
      if(!ok) $$(qe,".btn")[it.a].classList.add("right");
      const m=$(qe,".fb-msg"); m.className="fb-msg show "+(ok?"ok":"no");
      m.innerHTML=`<strong>${ok?"Correct.":"Not quite — it’s “"+choices[it.a]+".”"}</strong> ${it.why}`;
      if(done===items.length) $(root,".score").textContent=`You sorted ${right} of ${items.length} correctly.`;
    }));
  });
}

 {s:"A student in your medical assisting program pasted notes from her clinical rotation, including a patient’s name and diagnosis, into a free chatbot to help write her reflection.",c:[["Grade the reflection normally; the writing is good.",2,"This misses a serious privacy breach that could also violate the clinical site’s policies and HIPAA. Students need to learn this before they’re employed."],["Meet privately, explain the privacy issue, have her de-identify and resubmit, and teach the class a de-identification rule.",0,"Best. It treats it as a teachable moment, protects the patient, and prevents repeats. Check whether your clinical agreement requires reporting."],["Fail the assignment and report her for academic dishonesty.",1,"The concern is privacy, not cheating. A punitive response may be disproportionate if she wasn’t taught the rule."]]},
 {s:"Your dean suggests using an AI detector on every submission and treating scores above 80% as misconduct.",c:[["Agree; it’s efficient.",2,"Detectors have meaningful false-positive rates and bias against non-native English writers. A score alone isn’t evidence."],["Propose clear AIAS levels by assignment, process evidence, and conversations with students when there’s a concern.",0,"Best. It’s fairer and more reliable, and it focuses on learning."],["Ignore AI entirely.",1,"Avoids harm from detectors but leaves students without guidance."]]},
 {s:"AI-generated images for your construction safety slides show only men on the job site.",c:[["Use them; they’re just illustrations.",2,"Representation shapes who students believe belongs in the field."],["Regenerate with explicit diversity instructions, review the results, and discuss the bias with students.",0,"Best. It fixes the material and turns bias into a lesson."],["Stop using images.",1,"Avoids the issue but loses the benefit of visuals and the teaching moment."]]},
 {s:"You used AI to draft most of your new lab manual. A colleague asks whether you need to say so.",c:[["No — you reviewed it, so it’s your work.",1,"Your review matters, but transparency builds trust and models the disclosure you expect from students."],["Yes — add a short statement describing how AI was used and that content was verified by you.",0,"Best. Model the disclosure you ask of students. Check your college’s guidance as well."],["Remove the AI content to avoid the question.",2,"Throws away useful work instead of using it responsibly."]]},
 {s:"An assignment requires a premium AI subscription that costs about $20 a month. Several students can’t afford it.",c:[["Keep it; it’s industry standard.",2,"Creates an equity barrier tied to students’ finances."],["Redesign it to use a free or college-licensed tool, or provide campus access.",0,"Best. It preserves the learning goal and ensures equal access."],["Make the assignment optional.",1,"Reduces harm but leaves some students without the learning experience."]]}];
LABS[8]=[
{ icon:"🧭", title:"Dilemma simulator", desc:"Choose how you’d respond to each situation and see the reasoning.",
  html:()=>DILEMMAS.map((d,i)=>`<div class="q" data-d="${i}"><div class="stem">Scenario ${i+1}. ${d.s}</div><div class="opts">${d.c.map((c,j)=>`<button data-j="${j}">${c[0]}</button>`).join("")}</div><div class="fb-msg"></div></div>`).join(""),
  init:root=>{$$(root,"[data-d]").forEach(qe=>{const d=DILEMMAS[+qe.dataset.d];$$(qe,"[data-j]").forEach(b=>b.addEventListener("click",()=>{const c=d.c[+b.dataset.j];$$(qe,"[data-j]").forEach(x=>x.classList.remove("right","wrong"));b.classList.add(c[1]===0?"right":"wrong");
    const m=$(qe,".fb-msg");m.className="fb-msg show "+(c[1]===0?"ok":c[1]===1?"info":"no");m.innerHTML=`<strong>${["Strong choice.","Partly right.","Reconsider."][c[1]]}</strong> ${c[2]}${c[1]?" Try another option.":""}`;}));});}},
{ icon:"📜", title:"Course AI policy builder", desc:"Choose your positions and generate a draft syllabus policy to revise in your own voice.",
  html:()=>`<div class="two"><div>
  <label class="f" for="plC">Course</label><input type="text" id="plC" placeholder="e.g., HVAC 101">
  <label class="f" for="plS">Overall stance</label><select id="plS"><option value="0">AI is encouraged when used responsibly</option><option value="1" selected>AI is allowed as specified for each assignment</option><option value="2">AI is limited to specific assignments</option></select>
  <label class="f" for="plL">Default AIAS level when not specified</label><select id="plL">${AIAS.map((l,i)=>`<option value="${i}" ${i===1?"selected":""}>Level ${i+1}: ${l[0]}</option>`).join("")}</select>
  <label class="f" for="plD">Disclosure required</label><select id="plD"><option value="0">A short AI-use statement on every assignment that used AI</option><option value="1">Statement plus chat logs when requested</option><option value="2">Statement plus chat logs always</option></select>
  <label class="f">Also include</label>
  <label class="chk"><input type="checkbox" id="plP" checked> Privacy rule (no personal, patient, or customer data)</label>
  <label class="chk"><input type="checkbox" id="plV" checked> Verification responsibility</label>
  <label class="chk"><input type="checkbox" id="plA" checked> Approved and free tools only</label>
  <label class="chk"><input type="checkbox" id="plF" checked> How concerns will be handled</label>
  <label class="chk"><input type="checkbox" id="plW" checked> Workplace connection</label></div>
  <div><label class="f">Draft policy</label><div class="out" id="plO" aria-live="polite"></div><div class="btnrow"><button class="btn pri" id="plCp">Copy policy</button></div></div></div>`,
  init:root=>{const draw=()=>{const c=$(root,"#plC").value.trim()||"this course",s=+$(root,"#plS").value,l=+$(root,"#plL").value,d=+$(root,"#plD").value;
    const st=["In "+c+", you are encouraged to use AI tools to support your learning, as long as you use them responsibly and honestly.","In "+c+", AI use is allowed as specified for each assignment. Each assignment will state its AI level.","In "+c+", AI tools may be used only on assignments that specifically allow them."][s];
    const ds=["If you use AI on an assignment, include a short statement naming the tool, what you used it for, and what you changed or verified.","If you use AI, include a short statement naming the tool, what you used it for, and what you changed or verified. Be ready to share your chat log if asked.","If you use AI, include a short statement naming the tool, what you used it for, and what you changed or verified, and attach your chat log."][d];
    let t=`AI USE POLICY — ${c.toUpperCase()}\n\n${st}\n\nWe use the AI Assessment Scale. When an assignment doesn’t state a level, the default is Level ${l+1} (${AIAS[l][0]}): ${AIAS[l][2]}\n\nDisclosure: ${ds}`;
    if($(root,"#plP").checked)t+=`\n\nPrivacy: Never enter personal information about yourself, classmates, patients, clients, or customers into an AI tool.`;
    if($(root,"#plV").checked)t+=`\n\nVerification: You are responsible for everything you submit. AI can be wrong — verify facts, values, and procedures against trusted sources, especially anything involving safety.`;
    if($(root,"#plA").checked)t+=`\n\nTools: Use only approved tools that are free or provided by the college. You will never be required to pay for an AI tool.`;
    if($(root,"#plF").checked)t+=`\n\nConcerns: If I have questions about how work was produced, I will talk with you first. Using AI in ways an assignment doesn’t allow, or without disclosure, will be handled under the college’s academic integrity policy.`;
    if($(root,"#plW").checked)t+=`\n\nWhy this matters: Employers in our field use AI. Learning to use it skillfully, honestly, and safely is part of becoming a professional.`;
    $(root,"#plO").textContent=t;};
    $$(root,"input,select").forEach(e=>e.addEventListener("input",draw));$$(root,"input[type=checkbox]").forEach(e=>e.addEventListener("change",draw));
    $(root,"#plCp").addEventListener("click",()=>copyText($(root,"#plO").textContent));draw();}}
];

  $(root,"#qReset").addEventListener("click",()=>{ans={};$(root,"#qScore").textContent="";qs.forEach(qe=>{$$(qe,"[data-o]").forEach(x=>{x.disabled=false;x.className="";});$(qe,".fb-msg").className="fb-msg";});});
  // journal
  const jr=$(root,"#jr");jr.value=S.journal[n]||"";let jt;jr.addEventListener("input",()=>{clearTimeout(jt);jt=setTimeout(()=>{S.journal[n]=jr.value;save();$(root,"#jrS").textContent="Saved in this browser.";},500);});
  $(root,"#doneBtn").addEventListener("click",()=>{S.done[n]=!S.done[n];save();if(S.done[n])toast(`Week ${n} complete`);renderModule(n);document.getElementById("apply").scrollIntoView();});
}

function renderCapstone(){
  app().innerHTML=navHTML("capstone")+`
  <div class="crumb"><div class="wrap"><a href="#home">Home</a><span class="sep">›</span><b>Capstone</b></div></div>
  <header class="hero mhero"><span class="wk">Built across all 8 weeks</span><h1>Capstone: your AI-integrated module</h1><p class="sub">Redesign one module of a course you teach, and leave with something you can use next term</p></header>
  <main class="wrap narrow">
  <section class="msec"><h2 class="h2">What you’ll submit</h2><div class="cols">
   <div class="box n"><h4>Module plan</h4><p>Outcomes, sequence, and how AI is used by you and by students.</p></div>
   <div class="box n"><h4>Three or more materials</h4><p>AI-assisted, verified, accessible, and localized.</p></div>
   <div class="box n"><h4>Verification log</h4><p>What you checked, against what source, and what you changed.</p></div>
   <div class="box n"><h4>Student AI project</h4><p>An authentic task at the Use, Evaluate, or Create level.</p></div>
   <div class="box n"><h4>AIAS-labeled assessments</h4><p>Each with a student-facing AI statement and process evidence.</p></div>
   <div class="box n"><h4>Course AI policy</h4><p>Ready to paste into your syllabus.</p></div></div></section>
  <section class="msec"><h2 class="h2">Milestone tracker</h2><div class="box">${CAP_MS.map((t,i)=>`<label class="chk"><input type="checkbox" data-c="${i}" ${S.cap[i]?"checked":""}> <span><a href="#m${i+1}">${t}</a></span></label>`).join("")}
   <div class="meter" style="margin-top:1rem"><div id="capM"></div></div><p class="mini" id="capT"></p></div></section>
  <section class="msec"><h2 class="h2">Scoring rubric</h2><div class="tbl-wrap"><table><tr><th>Criterion</th><th>Exemplary</th><th>Developing</th><th>Beginning</th></tr>${RUBRIC.map(r=>`<tr><td><strong>${r[0]}</strong></td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join("")}</table></div>
  <div class="callout"><b class="ct">Peer review</b>In Week 8, swap modules with a colleague from a different program. Fresh eyes catch assumptions and accessibility gaps that subject experts miss.</div></section>
  <div class="bnav"><a href="#m8">← Week 8: Ethics</a><a href="#home">⌂ Course home</a></div></main>`+footer();
  window.scrollTo(0,0);
  const root=app();const draw=()=>{const k=CAP_MS.filter((x,i)=>S.cap[i]).length;$(root,"#capM").style.cssText=`width:${k/8*100}%;background:var(--green)`;$(root,"#capT").textContent=`${k} of 8 milestones complete.`;};
  $$(root,"[data-c]").forEach(c=>c.addEventListener("change",()=>{S.cap[c.dataset.c]=c.checked;save();draw();}));draw();
}

/* ================= ROUTER ================= */
function route(){
  const h=(location.hash||"").replace("#","");
  const mm=h.match(/^m([1-8])$/);
  if(mm)renderModule(+mm[1]);
  else if(h==="capstone")renderCapstone();
  else if(["modules","competencies","schedule"].includes(h))renderHome(h);
  else renderHome();
}
window.addEventListener("hashchange",route);
route();

</script>
</body>
</html>
